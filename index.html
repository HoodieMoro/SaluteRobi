<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5A52">
<meta name="robots" content="noindex">
<meta name="description" content="Diario della salute: medicine, pressione, battiti, peso, sonno e visite.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SaluteRobi">
<style>html{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>SaluteRobi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 480px), sticky header, fixed Android-style bottom bar.
   Large, high-legibility type for an older person; colour only carries meaning (good / attention / high). */
:root{
  --bg:#ECF2F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#13201E; --muted:#52615C; --line:#CFDAD6;
  --primary:#0B5A52; --on-primary:#FFFFFF; --primary-soft:#D5EBE6;
  --ok:#1C6E35; --ok-soft:#DBF0E1; --warn:#835400; --warn-soft:#FBEDCF; --bad:#B0261B; --bad-soft:#FADFDB;
  --info:#1F4F96; --info-soft:#DCE7F7;
  --sys:#C2362B; --dia:#2E61B0; --hr:#7B3FA3; --grid:#E1E8E5; --scrim:rgba(10,20,18,.45);
  --font-ui:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --font-head:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --fs:18px; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#172120; --surface-2:#1C2826; --ink:#E7EFEC; --muted:#9FB0AA; --line:#2C3A37;
  --primary:#62C7B8; --on-primary:#06231F; --primary-soft:#173430;
  --ok:#77D293; --ok-soft:#173222; --warn:#F2B451; --warn-soft:#382A10; --bad:#FF8C80; --bad-soft:#3D1A17;
  --info:#8DB4F2; --info-soft:#18263D;
  --sys:#FF7F73; --dia:#7FA9F0; --hr:#C597E6; --grid:#243230; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#172120; --surface-2:#1C2826; --ink:#E7EFEC; --muted:#9FB0AA; --line:#2C3A37;
  --primary:#62C7B8; --on-primary:#06231F; --primary-soft:#173430;
  --ok:#77D293; --ok-soft:#173222; --warn:#F2B451; --warn-soft:#382A10; --bad:#FF8C80; --bad-soft:#3D1A17;
  --info:#8DB4F2; --info-soft:#18263D;
  --sys:#FF7F73; --dia:#7FA9F0; --hr:#C597E6; --grid:#243230; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:1rem;line-height:1.45;margin:0}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:480px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-head);font-weight:600;font-size:1rem;display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;white-space:nowrap}
@media (max-width:400px){.brand .name{display:none}}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.demo-chip{font-size:.7rem;font-weight:700;letter-spacing:.02em;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.icon-btn{min-width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;display:inline-grid;place-items:center;padding:0 8px}
.icon-btn:disabled{opacity:.4;cursor:default}

main{display:flex;flex-direction:column;gap:16px;padding-block:6px calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main > *{min-width:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;background:none;border:0;color:var(--muted);font-size:.72rem;font-weight:700}
.tab .ti{width:58px;height:32px;border-radius:16px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--primary-soft);color:var(--primary)}

h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--font-head);font-weight:600;font-size:1.65rem;line-height:1.15;letter-spacing:-.01em}
.h2{font-family:var(--font-head);font-weight:600;font-size:1.2rem;line-height:1.25}
.h3{font-family:var(--font-head);font-weight:600;font-size:1.02rem}
.sec{font-family:var(--font-head);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 -4px}
.eyebrow{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .strong{font-weight:700} .center{text-align:center}
.title-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;gap:12px;align-items:flex-start}
.row-between{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}

.btn{min-height:54px;border-radius:14px;border:1.5px solid transparent;padding:0 18px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-danger-ghost{background:transparent;border-color:var(--bad-soft);color:var(--bad)}
.btn-sm{min-height:46px;font-size:.92rem;padding:0 14px}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > .btn{flex:1 1 140px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.crit{background:var(--bad);color:var(--surface)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* Oggi */
.hello{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.wx{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700}
.next{border-width:2px}
.next.late{border-color:var(--warn)} .next.now{border-color:var(--primary)}
.next-head{display:flex;align-items:center;justify-content:space-between}
.next-time{font-family:var(--font-head);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.doses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dose{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-child{border-top:0}
.pilldot{width:14px;height:14px;border-radius:50%;background:var(--primary-soft);border:3px solid var(--primary);flex:none}
.dose-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.mini{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.86rem;padding:0 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mini.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.mini.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.done-card{flex-direction:row;align-items:center;gap:14px}
.done-card > svg{width:40px;height:40px;color:var(--ok);background:var(--ok-soft);border-radius:50%;padding:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.q{min-height:96px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.95rem;padding:10px 4px}
.q svg.i{width:30px;height:30px;color:var(--primary)}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl-time{font-weight:700;font-variant-numeric:tabular-nums}
.tl-names{min-width:0;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile-val{font-family:var(--font-head);font-weight:600;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile-val small{font-size:.8rem;font-family:var(--font-ui);color:var(--muted);font-weight:700}
.disclaimer{font-size:.8rem;color:var(--muted);text-align:center;padding:4px 8px}

/* Medicine */
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--ok)}
.big-num{font-family:var(--font-head);font-weight:600;font-size:1.8rem;font-variant-numeric:tabular-nums}
.med-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.times{display:flex;gap:8px;flex-wrap:wrap}
.time-chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);font-weight:700;border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums}
.stock{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:700}
.dd i{width:100%;max-width:34px;height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.dd.ok i{background:var(--ok);border-color:var(--ok)} .dd.bad i{background:var(--bad);border-color:var(--bad)}
.dd.today i{background:var(--primary-soft);border:2px dashed var(--primary)}

/* Misure */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.steppers{display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.st-label{font-weight:700;display:flex;flex-direction:column;line-height:1.2}
.st-label small{color:var(--muted);font-weight:400;font-size:.8rem}
.st-row{display:flex;align-items:center;gap:6px}
.st-btn{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:1.6rem;font-weight:700;line-height:1;display:grid;place-items:center}
.st-in{width:4.2ch;height:52px;text-align:center;font-family:var(--font-head);font-size:1.55rem;font-weight:600;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0}
.st-in::-webkit-outer-spin-button,.st-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.filled .st-in{border-color:var(--primary);background:var(--primary-soft)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.check{display:flex;align-items:center;gap:12px;font-weight:700;min-height:46px}
.check input{width:24px;height:24px;accent-color:var(--primary);flex:none}
.sub{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.photo-btn{position:relative}
.ocr{display:flex;gap:12px;align-items:center;background:var(--info-soft);color:var(--ink);border-radius:12px;padding:10px}
.ocr img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.result{border-width:2px}
.result.ok{border-color:var(--ok)} .result.warn{border-color:var(--warn)} .result.bad,.result.crit{border-color:var(--bad)}
.result.crit{background:var(--bad-soft)}
.res-val{font-family:var(--font-head);font-weight:600;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.res-val small{font-size:1rem;color:var(--muted);font-family:var(--font-ui);font-weight:700}
.reading{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.reading:first-child{border-top:0}
.reading-val{font-family:var(--font-head);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.reading-meta{display:flex;flex-direction:column;min-width:0}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font-ui)}
.chart .line{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ref{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .lab{font-size:11px;font-weight:700;font-family:var(--font-ui)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--warn) 0 5px,transparent 5px 9px)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}

/* Storico */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{font-size:.8rem;font-weight:700;color:var(--muted)}
.kpi-v{font-family:var(--font-head);font-weight:600;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-d{font-size:.8rem;color:var(--muted)}
.ins{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.days{display:flex;flex-direction:column;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-head{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:none;border:0;padding:12px 14px;text-align:left;min-height:60px}
.day-date{display:flex;flex-direction:column;min-width:0}
.day-vals{display:flex;align-items:center;gap:8px}
.emo{font-size:1.3rem;line-height:1}
.chev{font-size:1.4rem;color:var(--muted);transition:transform .2s}
.day.open .chev{transform:rotate(90deg)}
.day-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.dl{display:flex;flex-direction:column;gap:4px}
.dl h4{margin:8px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* Visite */
.vis{flex-direction:row;align-items:flex-start;gap:14px}
.vis-date{flex:none;width:58px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;flex-direction:column;align-items:center;padding:8px 0}
.vis.past .vis-date{background:var(--surface-2);color:var(--muted)}
.vd-day{font-family:var(--font-head);font-size:1.5rem;font-weight:600;line-height:1}
.vd-mon{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.vis-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;align-items:flex-start}
.ref-img{border-radius:10px;border:1px solid var(--line);max-height:180px;object-fit:cover}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;width:100%}
.att{position:relative;min-width:0}
.att-open{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);font-weight:700;font-size:.78rem}
.att-open img{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#fff}
.att-pdf{width:100%;max-width:100%;aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--font-head);font-weight:600;font-size:1.3rem;color:var(--bad);background:var(--bad-soft)}
.att-k{padding:6px 4px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.att-k small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.att-x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.att-x svg.i{width:16px;height:16px}
#viewer{position:fixed;inset:0;z-index:58;background:var(--bg);display:flex;flex-direction:column;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.v-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.v-body{flex:1;overflow:auto;min-height:0}
.v-body img{width:100%;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.v-pdf{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:20px}
.v-pdf .att-pdf{width:120px;border-radius:12px}

/* Report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.rep-head{border-bottom:2px solid var(--ink);padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.report section{display:flex;flex-direction:column;gap:8px}
.rep-h{font-family:var(--font-head);font-size:.95rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--primary)}
.tbl-wrap{overflow-x:auto}
.rep-t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.rep-t th,.rep-t td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rep-t th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rep-t td.num{text-align:right;white-space:nowrap}
.rep-foot{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* Sheet, notification, toast */

(function(){
const LS='saluterobi-dati';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');

const MOODS=['😣','🙁','😐','🙂','😄'], MOODL=['Molto male','Male','Così così','Bene','Molto bene'];
const ENERGY=['Molto stanco','Un po\' stanco','Normale','In forma'];
const ACTS=['Camminata','Ginnastica','Bicicletta','Lavori in casa','Giardino o orto','Spesa a piedi','Altro'];
const SLEEPL=['Male','Poco bene','Così così','Bene','Benissimo'];
const fmt1=v=>v==null?'–':v.toFixed(1).replace('.',',');
const SYMS=['Nessuno','Mal di testa','Vertigini','Gambe gonfie','Fiato corto','Palpitazioni','Nausea','Dolore al petto'];
const MEALS=['Colazione','Pranzo','Cena'];
const BPCTX=['A riposo','Appena sveglio','Dopo le medicine','Dopo il caffè','Dopo uno sforzo','Agitato','Fa freddo','Fa caldo'];
const HRCTX=['Appena sveglio','A riposo','Dopo uno sforzo','Dopo il caffè','Agitato','Fa freddo','Fa caldo'];
const LIM={sys:[60,260],dia:[30,160],pulse:[30,200],sys2:[60,260],dia2:[30,160],pulse2:[30,200],bpm:[30,220],sleepH:[0,14],water:[0,20],actMin:[0,300],kg:[30,250]};
/* Average daily temperature per month around Jesi (AN), used only by the simulated weather. */
const MON_BASE=[6,7,10,13,18,22,25,25,21,16,11,7];

/* Weather: in the prototype it is simulated per day; the Android app reads it from a weather service. */
function simWeather(k){const d=kd(k);const dn=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  const h=(dn*2654435761)>>>0;const temp=Math.round(MON_BASE[d.getMonth()]+4*Math.sin(dn/3.3)+(h%5)-2);
  return {temp,cond:['Sereno','Poco nuvoloso','Nuvoloso','Pioggia'][(h>>>3)%4]}}
/* Real weather from Open-Meteo (free, no key). Example data falls back to the simulated weather. */
function weather(k){return (S&&S.wx&&S.wx[k])||(S&&S.demo?simWeather(k):null)}
function wcode(c){return c==null?'':c===0?'Sereno':c<=2?'Poco nuvoloso':c===3?'Nuvoloso':c<=48?'Nebbia':c<=57?'Pioviggine':c<=67?'Pioggia':c<=77?'Neve':c<=82?'Rovesci':'Temporale'}
async function fetchWeather(){const st=S.settings;if(st.lat==null||st.lon==null)return;
  try{const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${st.lat}&longitude=${st.lon}&current=temperature_2m,weather_code&daily=temperature_2m_mean,weather_code&past_days=31&forecast_days=1&timezone=auto`)).json();
    S.wx=S.wx||{};((j.daily&&j.daily.time)||[]).forEach((k,i)=>{const t=j.daily.temperature_2m_mean[i];if(t!=null)S.wx[k]={temp:Math.round(t),cond:wcode(j.daily.weather_code[i])}});
    if(j.current)S.wx[today()]={temp:Math.round(j.current.temperature_2m),cond:wcode(j.current.weather_code)};
    save();if($('#sheetWrap').hidden)render()}catch(e){}}
async function geocode(name){const q=name.replace(/\(.*?\)/g,'').trim();if(!q)return;
  try{const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=it&countryCode=IT`)).json();
    const p=j.results&&j.results[0];if(!p){toast('Non trovo questa città. Prova a scriverla in un altro modo.');return}
    S.settings.lat=p.latitude;S.settings.lon=p.longitude;save();toast(`Meteo impostato su ${p.name}`);fetchWeather()}
  catch(e){toast('Senza internet non riesco a trovare la città.')}}

function makeDemo(){
  const r=rng(11), t0=new Date(); t0.setHours(0,0,0,0); const nm=nowMin(), now=new Date();
  const meds=[
    {id:'lob',name:'Medicina A',dose:'5 mg',active:'Esempio',times:['08:00'],note:'1 compressa al mattino',stock:20,pack:28,form:'compressa'},
    {id:'olm',name:'Medicina B',dose:'10 mg',active:'Esempio',times:['08:00'],note:'1 compressa al mattino',stock:6,pack:28,form:'compressa'},
    {id:'ros',name:'Medicina C',dose:'20 mg',active:'Esempio',times:['20:00'],note:'1 compressa dopo cena',stock:25,pack:30,form:'compressa'}];
  const s={v:1,demo:true,settings:{name:'Mario',city:'Jesi (AN)',cap:'60035',lat:43.5225,lon:13.2437,bpTimes:['11:00','18:00'],big:false},wx:{},meds,doses:{},bp:[],hr:[],checkins:{},visits:[]};
  const skip={4:1,11:1,19:1,25:1}, shortSleep={2:1,4:1,9:1,15:1,22:1,26:1};
  for(let d=29;d>=0;d--){
    const day=addDays(t0,-d), k=dkey(day), temp=simWeather(k).temp;
    const sleep=shortSleep[d]?5+Math.round(r()*2)/2:6.5+Math.round(r()*4)/2;
    const active=r()>0.35;
    s.doses[k]={}; let skipped=false;
    meds.forEach(m=>m.times.forEach(t=>{
      if(d===0&&nm-toMin(t)<75)return;
      let st=r()<0.03?'skipped':'taken'; if(m.id==='lob'&&skip[d])st='skipped';
      if(st==='skipped')skipped=true; s.doses[k][m.id+'@'+t]=st;}));
    const base=125+(sleep<6?7:0)+(temp<9?5:0)+(skipped?9:0)+(active?0:4);
    const mk=(h,mi,off,ctx)=>{const t=new Date(day);t.setHours(h,mi+Math.floor(r()*15));if(t>now)return;
      const sys=Math.round(base+off+r()*10-5), dia=Math.round(sys*0.62+r()*6-2);
      s.bp.push({id:uid(),t:t.toISOString(),sys,dia,pulse:Math.round(62+r()*12),arm:'Sinistro',pos:'Seduto',ctx,temp})};
    mk(11,0,2,temp<9?['A riposo','Fa freddo']:['A riposo']); if(r()>0.15||d<2)mk(18,0,-3,['A riposo']);
    if(d>0&&r()<0.88){
      const mood=Math.max(1,Math.min(5,sleep<6?2+Math.round(r()):3+Math.round(r()*1.6)));
      const acts=active?(r()>0.3?['Camminata']:[ACTS[Math.floor(r()*6)]]):[];
      const sym=skipped&&r()<0.8?['Mal di testa']:sleep<6&&r()<0.4?['Vertigini']:['Nessuno'];
      s.checkins[k]={mood,energy:sleep<6?1:2+Math.round(r()),sleepH:sleep,sleepVote:sleep<6?1+Math.round(r()):3+Math.round(r()*2),
        meals:r()>0.08?['Colazione','Pranzo','Cena']:['Colazione','Pranzo'],water:4+Math.round(r()*4),
        active:active?'Sì':'No',activity:acts,actMin:active?20+5*Math.round(r()*6):0,symptoms:sym,
        note:d===11?'Stamattina la pastiglia me la sono scordata.':''};
    }
  }
  s.weight=[[28,91.8],[21,91.6],[14,91.5],[7,91.3]].map(([d,kg])=>{const t=addDays(t0,-d);t.setHours(7,30);return{id:uid(),t:t.toISOString(),kg}});
  {const t=new Date(t0);t.setHours(7,30);s.weight.push({id:uid(),t:(t>now?now:t).toISOString(),kg:91})}
  s.visits=[{id:uid(),type:'Visita',title:'Visita di controllo',date:'2027-05-01',tbd:true,time:'',place:'',doctor:'Dott. Rossi',notes:'Portare il report della pressione e la lista delle medicine.',result:'',remind:true}];
  sortAll(s); return s;
}
function sortAll(s=S){s.bp.sort((a,b)=>a.t<b.t?-1:1);s.hr.sort((a,b)=>a.t<b.t?-1:1);(s.weight=s.weight||[]).sort((a,b)=>a.t<b.t?-1:1)}
/* Heartbeat comes from the pressure monitor; separate heartbeat entries are added on top. */
function hrAll(){return S.bp.map(r=>({id:r.id,t:r.t,bpm:r.pulse,ctx:r.ctx||[],irr:r.irr||'No',temp:r.temp})).concat(S.hr).sort((a,b)=>a.t<b.t?-1:1)}

let S;
function emptyState(){return{v:1,demo:false,settings:{name:'',city:'',cap:'',lat:null,lon:null,bpTimes:['11:00','18:00'],big:false},meds:[],doses:{},bp:[],hr:[],weight:[],checkins:{},visits:[],wx:{}}}
function load(){try{const j=localStorage.getItem(LS);if(j){S=JSON.parse(j);return}}catch(e){} S=emptyState()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function importData(o){if(!o||!Array.isArray(o.meds))throw new Error('formato');const base=emptyState(),files=o.files;delete o.files;
  S=Object.assign(base,o,{settings:Object.assign(base.settings,o.settings||{}),demo:false});sortAll();save();return files}

/* Attachments (photos, PDFs) live in IndexedDB, which has far more room than localStorage.
   Only a small preview stays with the rest of the data. */
const FILES={_db:null,
  db(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open('saluterobi-file',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.db();return new Promise((res,rej)=>{const t=db.transaction('files',mode),q=fn(t.objectStore('files'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(id,blob){return this.tx('readwrite',s=>s.put(blob,id))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id)).catch(()=>{})},
  clear(){return this.tx('readwrite',s=>s.clear()).catch(()=>{})}};
const blobToDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
function imgToBlob(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
  im.onload=()=>{const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};im.src=u})}
async function restoreFiles(files){for(const [id,d] of Object.entries(files||{})){try{await FILES.put(id,await (await fetch(d)).blob())}catch(e){}}}
function allAtts(){return S.visits.flatMap(v=>(v.attachments||[]).map(a=>Object.assign({},a,{_v:v.title})))}
const ATT_KINDS=['Impegnativa','Referto','Ricetta','Altro'];
load();
/* A private setup link (#setup=...) loads the starting data on the phone; the data never sits in the public code. */
(function(){const h=location.hash;if(!h.startsWith('#setup='))return;
  try{const b=h.slice(7).replace(/-/g,'+').replace(/_/g,'/');importData(JSON.parse(decodeURIComponent(escape(atob(b)))));
    setTimeout(()=>toast(`Ciao ${S.settings.name||''}! Dati caricati 👍`),600)}
  catch(e){setTimeout(()=>toast('Questo link di configurazione non funziona.'),600)}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}})();

/* ---------- data helpers ---------- */
function groupsFor(k){const map={};S.meds.forEach(m=>m.times.forEach(t=>{(map[t]=map[t]||[]).push({m,key:m.id+'@'+t,st:(S.doses[k]||{})[m.id+'@'+t]||null})}));
  return Object.keys(map).sort().map(t=>({t,items:map[t]}))}
function groupState(g,isToday){if(g.items.every(i=>i.st==='taken'))return 'done';if(g.items.every(i=>i.st))return g.items.every(i=>i.st==='skipped')?'skipped':'partial';
  if(!isToday)return 'missed';const diff=nowMin()-toMin(g.t);if(diff>30)return 'late';if(diff>=-15)return 'now';return 'later'}
const GLAB={done:['ok','Prese'],partial:['warn','In parte'],skipped:['bad','Saltate'],late:['warn','In ritardo'],now:['info','Adesso'],later:['neutral','Più tardi'],missed:['bad','Non segnate']};
function setDose(k,key,st){S.doses[k]=S.doses[k]||{};const prev=S.doses[k][key];const m=S.meds.find(x=>key.startsWith(x.id+'@'));
  if(m){if(st==='taken'&&prev!=='taken')m.stock=Math.max(0,m.stock-1);if(prev==='taken'&&st!=='taken')m.stock++}
  if(st)S.doses[k][key]=st;else delete S.doses[k][key]}
function rangeKeys(n,off=0){const t=new Date();return Array.from({length:n},(_,i)=>dkey(addDays(t,-(off+n-1-i))))}
const inKeys=(arr,keys)=>{const s=new Set(keys);return arr.filter(r=>s.has(dkey(new Date(r.t))))};
const hour=r=>new Date(r.t).getHours();
function doseCount(keys,medId){let tot=0,taken=0;const tk=today();keys.forEach(k=>groupsFor(k).forEach(g=>g.items.forEach(i=>{
  if(medId&&i.m.id!==medId)return;if(k===tk&&!i.st&&toMin(g.t)>nowMin()-30)return;tot++;if(i.st==='taken')taken++})));
  return{tot,taken,pct:tot?Math.round(taken/tot*100):0}}
function summary(keys){

  const rest=hr.filter(r=>!r.ctx.includes('Dopo uno sforzo'));
  const cis=keys.map(k=>S.checkins[k]).filter(Boolean);const sym={};
  keys.forEach(k=>((S.checkins[k]||{}).symptoms||[]).forEach(x=>{if(x!=='Nessuno')(sym[x]=sym[x]||[]).push(k)}));
  const hi=bp.slice().sort((a,b)=>b.sys-a.sys)[0],lo=bp.slice().sort((a,b)=>a.sys-b.sys)[0];
  return{bp,hr,w,sys:avg(bp.map(r=>r.sys)),dia:avg(bp.map(r=>r.dia)),mSys:avg(m.map(r=>r.sys)),mDia:avg(m.map(r=>r.dia)),eSys:avg(e.map(r=>r.sys)),eDia:avg(e.map(r=>r.dia)),
    hi,lo,high:bp.filter(r=>r.sys>=135||r.dia>=85).length,hrAvg:avg(rest.map(r=>r.bpm)),hrMin:rest.length?Math.min(...rest.map(r=>r.bpm)):null,hrMax:rest.length?Math.max(...rest.map(r=>r.bpm)):null,
    dose:doseCount(keys),sleep:avg(cis.map(c=>c.sleepH)),sleepVote:avg(cis.filter(c=>c.sleepVote).map(c=>c.sleepVote)),
    act:cis.filter(c=>c.active==='Sì'),actMin:cis.reduce((t,c)=>t+(c.active==='Sì'?(+c.actMin||0):0),0),
    mood:avg(cis.filter(c=>c.mood).map(c=>c.mood)),sym,cis}}
function insights(){
  const keys=rangeKeys(30),out=[];
  const mSys=k=>{const r=inKeys(S.bp,[k]).filter(x=>hour(x)<12);return r.length?avg(r.map(x=>x.sys)):null};
  const cmp=(pred,text)=>{const a=[],b=[];keys.forEach(k=>{const v=mSys(k);if(v==null)return;const p=pred(k);if(p==null)return;(p?a:b).push(v)});
    if(a.length>=2&&b.length>=2){const d=Math.round(avg(a)-avg(b));if(d>=3)out.push(text(d,a.length))}};
  cmp(k=>S.checkins[k]&&S.checkins[k].sleepVote?S.checkins[k].sleepVote<=2:null,(d,n)=>`Dopo le notti dormite male (voto 1 o 2), la massima del mattino era più alta di <strong>${d} mmHg</strong> (${n} giorni).`);
  cmp(k=>S.checkins[k]&&S.checkins[k].active?S.checkins[k].active==='No':null,(d,n)=>`Nei giorni senza movimento, la massima era più alta di <strong>${d} mmHg</strong> rispetto ai giorni in cui ti sei mosso (${n} giorni).`);
  cmp(k=>S.doses[k]&&Object.keys(S.doses[k]).length?Object.values(S.doses[k]).includes('skipped'):null,(d,n)=>`Nei giorni con una medicina saltata, la massima era più alta di <strong>${d} mmHg</strong> (${n} giorni).`);
  cmp(k=>{const w=weather(k);return w?w.temp<9:null},(d,n)=>`Nei giorni freddi, sotto i 9°C, la massima era più alta di <strong>${d} mmHg</strong> (${n} giorni).`);

function bpCat(r){const s=r.sys,d=r.dia;
  if(s>=180||d>=110)return{cls:'crit',label:'Molto alta',msg:'Valori molto alti. Resta seduto tranquillo per 5 minuti e misura di nuovo. Se restano così, o se hai dolore al petto, forte mal di testa o difficoltà a parlare, chiama il 112.'};
  if(s>=135||d>=85)return{cls:'bad',label:'Alta',msg:'Un po\' alta: sopra 135/85, la soglia per le misure fatte a casa. Se ti capita spesso, parlane col medico.'};
  if(s<90||d<60)return{cls:'warn',label:'Bassa',msg:'Pressione bassa. Se hai capogiri siediti e bevi un bicchiere d\'acqua. Avvisa il medico se si ripete.'};
  if(s>=130||d>=80)return{cls:'warn',label:'Al limite',msg:'Un pelo sopra l\'ideale. Niente paura, continua a misurarla mattina e sera.'};
  return s>=120?{cls:'ok',label:'Normale',msg:'Tutto a posto, valori nella norma 👍'}:{cls:'ok',label:'Ottimale',msg:'Perfetta, valori ottimali! 👏'}}
function hrCat(r){if(r.bpm<50)return{cls:'warn',label:'Bassi',msg:'Battiti sotto 50 al minuto. Se ti senti debole o hai capogiri, avvisa il medico.'};
  if(r.bpm>100)return r.ctx.includes('Dopo uno sforzo')?{cls:'ok',label:'Normali dopo uno sforzo',msg:'Dopo uno sforzo è normale. Riprova dopo 10 minuti di riposo.'}:{cls:'bad',label:'Alti',msg:'Più di 100 battiti a riposo. Riposa e rimisura; se resta alto, avvisa il medico.'};
  return{cls:'ok',label:'Nella norma',msg:'Tutto a posto, battiti nella norma (tra 50 e 100 al minuto) 👍'}}

function lineChart(keys,series,o){
  const W=340,H=o.h||190,L=34,Rt=30,T=12,B=24,n=keys.length,min=o.min,max=o.max;
  const X=i=>L+(n<2?0:i*(W-L-Rt)/(n-1)),Y=v=>T+(max-Math.max(min,Math.min(max,v)))*(H-T-B)/(max-min);
  if(!series.some(s=>s.vals.some(v=>v!=null)))return `<p class="empty">Nessuna misurazione in questo periodo.</p>`;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  for(let v=min;v<=max;v+=o.step)s+=`<line class="grid" x1="${L}" x2="${W-Rt}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  (o.refs||[]).forEach(v=>s+=`<line class="ref" x1="${L}" x2="${W-Rt}" y1="${Y(v)}" y2="${Y(v)}"/>`);
  const every=Math.max(1,Math.ceil(n/6));
  keys.forEach((k,i)=>{if((n-1-i)%every===0){const d=kd(k);s+=`<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="middle">${d.getDate()}/${d.getMonth()+1}</text>`}});
  series.forEach(se=>{let p='',pen=false,last=null;se.vals.forEach((v,i)=>{if(v==null){pen=false;return}p+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true;last=i});
    s+=`<path class="line" d="${p}" style="stroke:var(${se.c})"/>`;
    se.vals.forEach((v,i)=>{if(v!=null&&i!==last)s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" style="fill:var(${se.c})"/>`});
    if(last!=null)s+=`<circle cx="${X(last)}" cy="${Y(se.vals[last])}" r="5.5" style="fill:var(${se.c});stroke:var(--surface);stroke-width:2.5"/><text class="lab" x="${X(last)+8}" y="${Y(se.vals[last])+4}" style="fill:var(${se.c})">${Math.round(se.vals[last])}</text>`});
  return s+'</svg>'}
function bpChart(keys){const day=f=>keys.map(k=>{const r=inKeys(S.bp,[k]);return r.length?avg(r.map(f)):null});
  return lineChart(keys,[{c:'--sys',vals:day(r=>r.sys)},{c:'--dia',vals:day(r=>r.dia)}],{min:60,max:180,step:20,refs:[135,85],label:'Pressione media giornaliera'})+

function hrChart(keys){const H=hrAll();const vals=keys.map(k=>{const r=inKeys(H,[k]).filter(x=>hour(x)<12);return r.length?avg(r.map(x=>x.bpm)):null});
  return lineChart(keys,[{c:'--hr',vals}],{min:40,max:110,step:10,refs:[100],label:'Battiti al mattino',h:170})+

function wCat(r){const prev=(S.weight||[]).filter(x=>x.t<r.t),p=prev[prev.length-1];
  if(!p)return{cls:'ok',label:'Prima pesata',msg:'Ottimo, da qui in poi vediamo come va.'};
  const days=(new Date(r.t)-new Date(p.t))/864e5,dk=Math.round((r.kg-p.kg)*10)/10,lab=`${dk>0?'+':''}${fmt1(dk)} kg`;
  if(dk>=2&&days<=4)return{cls:'bad',label:lab,msg:'Sei salito di 2 kg o più in pochi giorni. Se hai anche le gambe gonfie o il fiato corto, senti il medico.'};
  return{cls:'ok',label:lab,msg:dk<0?'In calo rispetto all\'ultima pesata 👍':dk===0?'Stabile rispetto all\'ultima pesata.':'Un pochino in più rispetto all\'ultima pesata, niente di strano.'}}
function wChart(pts){if(pts.length<2)return '<p class="empty">Servono almeno due pesate per il grafico.</p>';
  const v=pts.map(p=>p.kg),mn=Math.floor(Math.min(...v)-1),mx=Math.ceil(Math.max(...v)+1);
  return lineChart(pts.map(p=>dkey(new Date(p.t))),[{c:'--primary',vals:v}],{min:mn,max:mx,step:mx-mn>6?2:1,label:'Andamento del peso',h:170})}
function wView(){const W=S.weight||[],res=lastRes&&lastRes.type==='w'?lastRes.r:null,recent=W.slice(-6).reverse();
  return `<section class="card"><div class="row-between"><h2 class="h2">Peso</h2><span class="muted small">meglio al mattino, prima di colazione</span></div>

    <button class="btn btn-primary btn-block" data-a="saveW">${ico.check}Salva peso</button></section>
  ${res?resultCard(fmt1(res.kg),'kg',wCat(res),'peso di oggi'):''}
  <section class="card"><h2 class="h3">Andamento</h2>${wChart(W.slice(-12))}</section>
  <section class="card"><h2 class="h3">Ultime pesate</h2><ul class="list">${recent.map(r=>{const c=wCat(r);return `<li class="reading"><span class="reading-val">${fmt1(r.kg)} kg</span>
    <span class="reading-meta"><span class="small">${whenStr(r.t)}</span></span><span class="pill ${c.cls}">${c.label}</span></li>`}).join('')||'<li class="empty">Ancora nessuna pesata.</li>'}</ul></section>`}
function bpView(){const d=bpD,w=weather(today()),keys=rangeKeys(14),res=lastRes&&lastRes.type==='bp'?lastRes.r:null;
  const recent=S.bp.slice(-6).reverse();
  return `<section class="card">
    <div class="row-between"><h2 class="h2">Nuova misurazione</h2><span class="muted small">${hm(new Date())}${w?` · fuori ${w.temp}°C`:''}</span></div>
    ${ocr?`<div class="ocr">${ocr.img?`<img src="${ocr.img}" alt="Foto del misuratore">`:''}<p class="small">${ocr.state==='reading'?'<strong>Sto leggendo i numeri…</strong>':'<strong>Numeri letti dalla foto.</strong> Controllali prima di salvare. Nel prototipo la lettura è simulata.'}</p></div>`:''}
    <div class="steppers ${ocr&&ocr.state==='done'?'filled':''}">${stepper('sys','Massima','mmHg',d.sys,'sistolica')}${stepper('dia','Minima','mmHg',d.dia,'diastolica')}${stepper('pulse','Battiti','bpm',d.pulse,'dal misuratore')}</div>
    <label class="check"><input type="checkbox" id="two" ${d.two?'checked':''}>Ho misurato 2 volte, a 1 minuto di distanza</label>
    ${d.two?`<div class="sub"><p class="small muted">Seconda misurazione. L'app salva la media delle due.</p><div class="steppers">${stepper('sys2','Massima','mmHg',d.sys2)}${stepper('dia2','Minima','mmHg',d.dia2)}${stepper('pulse2','Battiti','bpm',d.pulse2)}</div></div>`:''}
    <fieldset><legend>Braccio</legend>${chips('bp','arm',['Sinistro','Destro'])}</fieldset>
    <fieldset><legend>Posizione</legend>${chips('bp','pos',['Seduto','Sdraiato','In piedi'])}</fieldset>
    <fieldset><legend>In che momento?</legend>${chips('bp','ctx',BPCTX,true)}</fieldset>
    <fieldset><legend>Il misuratore segnala battito irregolare?</legend>${chips('bp','irr',['No','Sì'])}</fieldset>
    <button class="btn btn-primary btn-block" data-a="saveBp">${ico.check}Salva misurazione</button></section>
  ${res?resultCard(`${res.sys}/${res.dia}`,'mmHg',bpCat(res),`Battiti ${res.pulse}${res.temp!=null?` · fuori ${res.temp}°C`:''}${res.two?' · media di 2 misure':''}`):''}
  <section class="card"><h2 class="h3">Ultimi 14 giorni</h2>${bpChart(keys)}<p class="muted small">Fasce indicative per le misure fatte a casa (linee guida europee ESH). Decide sempre il medico.</p></section>
  <section class="card"><h2 class="h3">Ultime misurazioni</h2><ul class="list">${recent.map(r=>{const c=bpCat(r);return `<li class="reading"><span class="reading-val">${r.sys}/${r.dia}</span>
    <span class="reading-meta"><span class="small">${whenStr(r.t)}</span><span class="muted small">${[r.pulse+' bpm',...(r.ctx||[])].join(' · ')}</span></span><span class="pill ${c.cls}">${c.label}</span></li>`}).join('')||'<li class="empty">Ancora nessuna misurazione.</li>'}</ul></section>`}
function hrView(){const d=hrD,w=weather(today()),keys=rangeKeys(14),res=lastRes&&lastRes.type==='hr'?lastRes.r:null;const recent=hrAll().slice(-6).reverse();
  return `<section class="card">
    <div class="row-between"><h2 class="h2">Battiti da soli</h2><span class="muted small">${hm(new Date())}${w?` · fuori ${w.temp}°C`:''}</span></div>
    <p class="muted small">Di solito i battiti arrivano dal misuratore insieme alla pressione. Qui puoi segnarli anche a parte, per esempio dopo una camminata.</p>
    <div class="steppers">${stepper('bpm','Battiti al minuto','bpm',d.bpm,'conta per 30 secondi e moltiplica per 2')}</div>
    <fieldset><legend>In che situazione?</legend>${chips('hr','ctx',HRCTX,true)}</fieldset>

  ${res?resultCard(res.bpm,'bpm',hrCat(res),`${(res.ctx||[]).join(' · ')||'Nessuna situazione indicata'}${res.temp!=null?` · fuori ${res.temp}°C`:''}`,res.irr==='Sì'?'Hai indicato battito irregolare. Se ti capita spesso, dillo al medico.':''):''}

  <section class="card"><h2 class="h3">Ultime misurazioni</h2><ul class="list">${recent.map(r=>{const c=hrCat(r);return `<li class="reading"><span class="reading-val">${r.bpm}</span>
    <span class="reading-meta"><span class="small">${whenStr(r.t)}</span><span class="muted small">${[...(r.ctx||[]),r.temp!=null?r.temp+'°C fuori':''].filter(Boolean).join(' · ')}</span></span><span class="pill ${c.cls}">${c.label}</span></li>`}).join('')||'<li class="empty">Ancora nessuna misurazione.</li>'}</ul></section>`}
function resultCard(val,unit,c,meta,extra){return `<section class="card result ${c.cls}" id="result" tabindex="-1">

function viewStorico(){const W=S.weight||[],lastW=W[W.length-1],dW=W.length>=2?Math.round((W[W.length-1].kg-W[W.length-2].kg)*10)/10:null;
  const wk=summary(rangeKeys(7)),pw=summary(rangeKeys(7,7)),ins=insights(),k7=rangeKeys(7);

  const sumTxt=`Pressione media ${R(wk.sys)}/${R(wk.dia)}, medicine prese ${wk.dose.pct}%, ${wk.act.length} giorni di movimento, sonno ${fmt1(wk.sleepVote)}/5${lastW?`, peso ${fmt1(lastW.kg)} kg`:''}. ${wk.act.length>=4?'Grande! 💪':'Dai che la prossima settimana ci muoviamo di più! 🚶'}`;
  return `<div class="title-row"><h1 class="h1">Storico</h1><button class="btn btn-primary btn-sm" data-a="go" data-r="report">${ico.doc}Report per il medico</button></div>
  <section class="card"><p class="eyebrow">Riepilogo settimanale</p><h2 class="h2">Dal ${fDM.format(kd(k7[0]))} al ${fDM.format(kd(k7[6]))}</h2>
    <div class="kpis">
      <div class="kpi"><span class="kpi-l">Pressione media</span><span class="kpi-v">${R(wk.sys)}/${R(wk.dia)}</span><span class="kpi-d">${dTxt}</span></div>
      <div class="kpi"><span class="kpi-l">Battiti a riposo</span><span class="kpi-v">${R(wk.hrAvg)} bpm</span><span class="kpi-d">da ${R(wk.hrMin)} a ${R(wk.hrMax)}</span></div>
      <div class="kpi"><span class="kpi-l">Medicine prese</span><span class="kpi-v">${wk.dose.pct}%</span><span class="kpi-d">${wk.dose.taken} su ${wk.dose.tot}</span></div>
      <div class="kpi"><span class="kpi-l">Movimento</span><span class="kpi-v">${wk.act.length} ${wk.act.length===1?'giorno':'giorni'}</span><span class="kpi-d">${wk.actMin} minuti in tutto</span></div>
      <div class="kpi"><span class="kpi-l">Sonno e umore</span><span class="kpi-v">${fmt1(wk.sleepVote)}/5 ${wk.mood?MOODS[Math.round(wk.mood)-1]:''}</span><span class="kpi-d">circa ${fmt1(wk.sleep)} ore a notte</span></div>
      <div class="kpi"><span class="kpi-l">Peso</span><span class="kpi-v">${lastW?fmt1(lastW.kg)+' kg':'–'}</span><span class="kpi-d">${dW!=null?`${dW>0?'+':''}${fmt1(dW)} kg dall'ultima pesata`:'pesati una volta a settimana'}</span></div></div>
    <p class="small muted">Così arriva la domenica sera sul telefono:</p>
    <div class="n-card static"><div class="n-head"><span class="n-ic">${ico.heart}</span>SaluteRobi<span class="muted">· domenica 21:00</span></div><p class="n-title">Ecco com'è andata la settimana 📋</p><p class="n-body">${sumTxt}</p></div></section>
  ${ins.length?`<section class="card"><h2 class="h3">Cosa si nota negli ultimi 30 giorni</h2><ul class="ins">${ins.map(t=>`<li>${t}</li>`).join('')}</ul><p class="muted small">Sono osservazioni sui dati registrati, non una diagnosi. Parlane con il medico prima di cambiare qualcosa.</p></section>`:''}
  <section class="card"><h2 class="h3">Pressione, ultimi 30 giorni</h2>${bpChart(rangeKeys(30))}</section>
  <section class="card"><h2 class="h3">Battiti, ultimi 30 giorni</h2>${hrChart(rangeKeys(30))}</section>
  <h2 class="sec">Giorno per giorno</h2><div class="days">${rangeKeys(14).reverse().map(dayRow).join('')}</div>`}
function dayRow(k){const d=kd(k),bp=inKeys(S.bp,[k]),hr=inKeys(S.hr,[k]),c=S.checkins[k],w=weather(k),open=openDay===k,dc=doseCount([k]);
  const first=bp[0];
  return `<article class="day ${open?'open':''}"><button class="day-head" data-a="day" data-k="${k}" aria-expanded="${open}">
    <span class="day-date"><strong>${k===today()?'Oggi':cap(fShort.format(d))}</strong><span class="muted small">${w?w.temp+'°C · ':''}medicine ${dc.taken}/${dc.tot}</span></span>
    <span class="day-vals">${first?`<span class="pill ${bpCat(first).cls}">${first.sys}/${first.dia}</span>`:''}${c?`<span class="emo" aria-label="${MOODL[c.mood-1]}">${MOODS[c.mood-1]}</span>`:''}</span><span class="chev" aria-hidden="true">›</span></button>
    ${open?`<div class="day-body">
      <div class="dl"><h4>Pressione</h4>${bp.map(r=>`<span>${hm(new Date(r.t))} · <strong>${r.sys}/${r.dia}</strong> · ${r.pulse} bpm${r.ctx&&r.ctx.length?' · '+r.ctx.join(', '):''}</span>`).join('')||'<span class="muted">Nessuna misura</span>'}</div>
      <div class="dl" ${hr.length?'':'hidden'}><h4>Battiti presi a parte</h4>${hr.map(r=>`<span>${hm(new Date(r.t))} · <strong>${r.bpm} bpm</strong>${r.ctx.length?' · '+r.ctx.join(', '):''}${r.irr==='Sì'?' · irregolare':''}</span>`).join('')||'<span class="muted">Nessuna misura</span>'}</div>
      ${inKeys(S.weight||[],[k]).map(x=>`<div class="dl"><h4>Peso</h4><span>${fmt1(x.kg)} kg</span></div>`).join('')}<div class="dl"><h4>Medicine</h4>${groupsFor(k).map(g=>`<span>${g.t} · ${g.items.map(i=>`${esc(i.m.name)} ${i.st==='taken'?'✓':i.st==='skipped'?'<strong style="color:var(--bad)">saltata</strong>':'<span class="muted">non segnata</span>'}`).join(', ')}</span>`).join('')}</div>
      <div class="dl"><h4>Come stava</h4>${c?`<span>${MOODS[c.mood-1]} ${MOODL[c.mood-1]} · ${ENERGY[c.energy]}</span><span>Sonno: ${c.sleepVote?`voto ${c.sleepVote}/5 (${SLEEPL[c.sleepVote-1].toLowerCase()})`:'non indicato'}${c.sleepH?` · circa ${c.sleepH} ore`:''}</span><span>Pasti: ${c.meals.join(', ')||'nessuno'} · acqua ${c.water} bicchieri</span><span>Movimento: ${c.active==='Sì'?`sì${c.activity&&c.activity.length?' · '+esc(c.activity.join(', ')):''}${c.actMin?' · '+c.actMin+' min':''}`:c.active==='No'?'no':'non indicato'}</span><span>Disturbi: ${c.symptoms.join(', ')||'–'}</span>${c.note?`<span>Nota: “${esc(c.note)}”</span>`:''}`:'<span class="muted">Questionario non compilato</span>'}</div>
    </div>`:''}</article>`}

function viewVisite(){const k=today(),by=(a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1;

function visCard(v){const d=kd(v.date),t0=kd(today()),days=Math.round((d-t0)/864e5);

function viewReport(){const keys=rangeKeys(repDays),s=summary(keys),from=kd(keys[0]),to=kd(keys[keys.length-1]),ins=insights();
  const symRows=Object.entries(s.sym).map(([n,ks])=>`<tr><td>${esc(n)}</td><td class="num">${ks.length} ${ks.length===1?'volta':'volte'}</td><td>${ks.map(k=>fDM.format(kd(k))).join(', ')}</td></tr>`).join('');
  return `<div class="title-row" style="justify-content:flex-start"><button class="icon-btn" data-a="go" data-r="storico" aria-label="Torna allo storico">${ico.back}</button><h1 class="h1">Report per il medico</h1></div>
  <div class="seg" role="tablist"><button role="tab" data-a="repDays" data-v="7" aria-selected="${repDays===7}">Ultimi 7 giorni</button><button role="tab" data-a="repDays" data-v="30" aria-selected="${repDays===30}">Ultimi 30 giorni</button></div>
  <article class="report">
    <header class="rep-head"><p class="eyebrow">SaluteRobi · misure fatte a casa</p><h2 class="h2">${esc(S.settings.name||'Paziente')}</h2>
      <p class="muted small">Dal ${fLong.format(from)} al ${fLong.format(to)} · creato il ${fLong.format(new Date())}</p></header>
    <section><h3 class="rep-h">Pressione arteriosa</h3><div class="tbl-wrap"><table class="rep-t"><tbody>
      <tr><td>Media del mattino</td><td class="num"><strong>${R(s.mSys)}/${R(s.mDia)}</strong> mmHg</td></tr>
      <tr><td>Media della sera</td><td class="num"><strong>${R(s.eSys)}/${R(s.eDia)}</strong> mmHg</td></tr>
      <tr><td>Valore più alto</td><td class="num">${s.hi?`${s.hi.sys}/${s.hi.dia} · ${fDM.format(new Date(s.hi.t))}`:'–'}</td></tr>
      <tr><td>Valore più basso</td><td class="num">${s.lo?`${s.lo.sys}/${s.lo.dia} · ${fDM.format(new Date(s.lo.t))}`:'–'}</td></tr>
      <tr><td>Misurazioni sopra 135/85</td><td class="num">${s.high} su ${s.bp.length}${s.bp.length?` (${Math.round(s.high/s.bp.length*100)}%)`:''}</td></tr></tbody></table></div>
      ${bpChart(keys)}</section>
    <section><h3 class="rep-h">Frequenza cardiaca a riposo</h3><p>Media <strong>${R(s.hrAvg)} bpm</strong>, da ${R(s.hrMin)} a ${R(s.hrMax)} · ${s.hr.filter(r=>r.irr==='Sì').length} episodi di battito irregolare segnalati.</p></section>
    <section><h3 class="rep-h">Peso</h3><p>${s.w.length?`Ultimo valore <strong>${fmt1(s.w[s.w.length-1].kg)} kg</strong> (${fDM.format(new Date(s.w[s.w.length-1].t))})${s.w.length>=2?` · nel periodo da ${fmt1(s.w[0].kg)} a ${fmt1(s.w[s.w.length-1].kg)} kg`:''}`:'Nessuna pesata nel periodo.'}</p></section>
    <section><h3 class="rep-h">Terapia e aderenza</h3><div class="tbl-wrap"><table class="rep-t"><thead><tr><th>Medicina</th><th>Orari</th><th>Prese</th></tr></thead><tbody>
      ${S.meds.map(m=>{const c=doseCount(keys,m.id);return `<tr><td><strong>${esc(m.name)}</strong> ${esc(m.dose)}${m.active?`<br><span class="muted small">${esc(m.active)}</span>`:''}</td><td>${m.times.join(', ')}</td><td class="num">${c.taken}/${c.tot} (${c.pct}%)</td></tr>`}).join('')}</tbody></table></div></section>
    <section><h3 class="rep-h">Benessere riferito</h3><p>Qualità del sonno (voto del paziente): <strong>${fmt1(s.sleepVote)} su 5</strong>, circa ${fmt1(s.sleep)} ore a notte.</p>
      <p>Attività fisica: <strong>${s.act.length} giorni su ${s.cis.length}</strong> con questionario, ${s.actMin} minuti in tutto${s.act.length?`, soprattutto ${(()=>{const c={};s.act.forEach(x=>(x.activity||[]).forEach(a=>c[a]=(c[a]||0)+1));const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return top?esc(top[0].toLowerCase()):'attività varie'})()}`:''}.</p>
      <p>Umore medio ${s.mood?MOODL[Math.round(s.mood)-1].toLowerCase():'–'} · questionario compilato ${s.cis.length} giorni su ${keys.length}.</p>
      ${symRows?`<div class="tbl-wrap"><table class="rep-t"><thead><tr><th>Disturbo</th><th>Quante</th><th>Quando</th></tr></thead><tbody>${symRows}</tbody></table></div>`:'<p class="muted small">Nessun disturbo segnalato.</p>'}</section>
    ${ins.length?`<section><h3 class="rep-h">Osservazioni dai dati</h3><ul class="ins small">${ins.map(t=>`<li>${t}</li>`).join('')}</ul></section>`:''}
    <footer class="rep-foot">Valori registrati dal paziente a casa con il proprio misuratore. Il documento riassume i dati e non contiene diagnosi.</footer></article>
  <button class="btn btn-primary btn-block" data-a="pdf">${ico.doc}Salva come PDF o stampa</button>
  <p class="muted small center pdf-note">Si apre la finestra di stampa: scegli «Salva come PDF», poi puoi mandarlo con WhatsApp o email.</p>`}

function openSheet(html){const w=$('#sheetWrap'),s=$('.sheet'),st=w.hidden?0:s.scrollTop;s.innerHTML=html;w.hidden=false;document.body.classList.add('noscroll');s.scrollTop=st}

async function addAttachments(list){let n=0;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  for(const f of list){try{let blob,thumb=null,mime=f.type||'';
      if(mime.startsWith('image/')){blob=await imgToBlob(f,1800,0.82);thumb=await blobToDataURL(await imgToBlob(f,240,0.7));mime='image/jpeg'}
      else if(mime==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>20e6){toast('Questo PDF è troppo grande (massimo 20 MB).');continue}blob=f;mime='application/pdf'}
      else{toast('Si possono allegare solo foto o PDF.');continue}
      const id='f'+uid()+uid();await FILES.put(id,blob);
      visD.attachments=visD.attachments||[];visD.attachments.push({id,kind:visD._kind||'Impegnativa',name:f.name||'',mime,size:blob.size,thumb,added:new Date().toISOString()});
      (visD._new=visD._new||[]).push(id);n++}
    catch(e){toast('Non riesco ad aprire questo file. Prova con un altro.')}}
  if(n){renderVis();toast(n===1?'Allegato aggiunto. Ricordati di premere Salva.':`${n} allegati aggiunti. Ricordati di premere Salva.`)}}

async function openAtt(id){const meta=allAtts().find(a=>a.id===id)||((visD&&visD.attachments)||[]).find(a=>a.id===id);let blob=null;
  try{blob=await FILES.get(id)}catch(e){}

  let el=$('#viewer');if(!el){el=document.createElement('div');el.id='viewer';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}

function showNotif(g){const n=$('#notif');n.innerHTML=`<div class="n-card" role="alert"><div class="n-head"><span class="n-ic">${ico.heart}</span>SaluteRobi<span class="muted">· adesso</span></div>

  n.hidden=false;clearTimeout(nT);nT=setTimeout(()=>n.hidden=true,15000)}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3200)}
function readImg(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;
  im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.src=fr.result};fr.readAsDataURL(file)})}

const A={

    markGroup(el.dataset.t,s);render();toast(s==='taken'?'Ottimo, segnate come prese! 👍':'Segnate come saltate')},
  step(el){const f=el.dataset.f,d=DRAFT(f),inc=f==='sleepH'?0.5:f==='actMin'?5:f==='kg'?0.1:1,[lo,hi]=LIM[f];d[f]=Math.round(Math.max(lo,Math.min(hi,(+d[f]||0)+inc*(+el.dataset.d)))*10)/10;const i=document.getElementById('f-'+f);if(i)i.value=d[f]},

    if(el.dataset.multi){let a=o[k]||[];if(a.includes(v))a=a.filter(x=>x!==v);else{a=[...a,v];if(k==='symptoms')a=v==='Nessuno'?['Nessuno']:a.filter(x=>x!=='Nessuno')}o[k]=a}else o[k]=v;
    if(el.closest('.sheet')&&sheetR)sheetR();else render()},
  saveBp(){const d=bpD;let sys=+d.sys,dia=+d.dia,pulse=+d.pulse;
    if(d.two){sys=Math.round((sys+ +d.sys2)/2);dia=Math.round((dia+ +d.dia2)/2);pulse=Math.round((pulse+ +d.pulse2)/2)}
    if(!(sys>=60&&sys<=260&&dia>=30&&dia<=160&&sys>dia)){toast('Controlla i numeri: la massima deve essere più alta della minima.');return}
    const now=new Date(),r={id:uid(),t:now.toISOString(),sys,dia,pulse,arm:d.arm,pos:d.pos,ctx:d.ctx,irr:d.irr,temp:(weather(today())||{}).temp??null,two:!!d.two};
    S.bp.push(r);sortAll();save();lastRes={type:'bp',r};bpD=newBp();ocr=null;render();toast('Fatto, misurazione salvata!');focusResult()},
  saveHr(){const b=+hrD.bpm;if(!(b>=30&&b<=220)){toast('Controlla il numero dei battiti.');return}

  attKind(el){visD._kind=el.dataset.v;renderVis()},
  attDel(el){const id=el.dataset.id;visD.attachments=(visD.attachments||[]).filter(a=>a.id!==id);
    if(visD._new&&visD._new.includes(id)){visD._new=visD._new.filter(x=>x!==id);FILES.del(id)}else(visD._removed=visD._removed||[]).push(id);renderVis()},
  attOpen(el){openAtt(el.dataset.id)},
  viewerClose(){closeViewer()},
  async attShare(el){const id=el.dataset.id,meta=allAtts().find(a=>a.id===id)||((visD&&visD.attachments)||[]).find(a=>a.id===id);let blob=null;try{blob=await FILES.get(id)}catch(e){}
    if(!blob){toast('Non trovo questo file.');return}
    const name=attFileName(meta,blob),f=new File([blob],name,{type:blob.type||(meta&&meta.mime)||''});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:meta?meta.kind:'Allegato'});return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('File salvato nei download')},
  visSave(){const e=$('#v-err');if(!visD.title.trim()||!visD.date){e.textContent='Scrivi il titolo e il giorno.';e.hidden=false;return}
    (visD._removed||[]).forEach(id=>FILES.del(id));const v=Object.assign({},visD);delete v._new;delete v._removed;delete v._kind;visD._new=null;
    if(v.id){const i=S.visits.findIndex(x=>x.id===v.id);S.visits[i]=v}else{v.id=uid();S.visits.push(v)}
    save();closeSheet();render();toast('Appuntamento salvato')},
  visDel(){if(!delArm){delArm=true;renderVis();return}
    const old=S.visits.find(x=>x.id===visD.id);[...((old&&old.attachments)||[]),...(visD.attachments||[])].forEach(a=>FILES.del(a.id));visD._new=null;
    S.visits=S.visits.filter(x=>x.id!==visD.id);save();closeSheet();render();toast('Appuntamento eliminato')},
  pdf(){try{window.print()}catch(e){toast('Questo telefono non riesce a creare il PDF da qui.')}},
  async exportData(){const name=`saluterobi-${today()}.json`,files={},atts=allAtts();
    if(atts.length)toast('Preparo la copia con gli allegati…');
    for(const a of atts){try{const b=await FILES.get(a.id);if(b)files[a.id]=await blobToDataURL(b)}catch(e){}}
    const txt=JSON.stringify(Object.assign({},S,{files}));
    try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Copia dati SaluteRobi'});return}}
    catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Copia salvata nei download')},
  bigText(){S.settings.big=!S.settings.big;save();applySettings();toast(S.settings.big?'Caratteri più grandi':'Caratteri normali')},
  settings(){delArm=false;sheetR=renderSettings;renderSettings()},
  resetDemo(){S=makeDemo();save();bpD=newBp();hrD=newHr();lastRes=null;applySettings();closeSheet();render();toast('Dati di esempio ricaricati')},
  wipe(){if(!delArm){delArm=true;renderSettings();return}FILES.clear();S=Object.assign(emptyState(),{settings:S.demo?emptyState().settings:S.settings});
    save();bpD=newBp();hrD=newHr();lastRes=null;closeSheet();render();toast('Tutti i dati sono stati cancellati')}
};
function focusResult(){const r=document.getElementById('result');if(r){r.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});r.focus({preventScroll:true})}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset;
  if(ds.f){DRAFT(ds.f)[ds.f]=t.value===''?'':+t.value}
  else if(ds.m){medD[ds.m]=t.value}
  else if(ds.mt!=null){medD.times[+ds.mt]=t.value}
  else if(ds.vf){visD[ds.vf]=t.value}
  else if(ds.set){S.settings[ds.set]=t.value;S.demo=S.demo;save();render()}
  else if(t.id==='ci-note'){ci.note=t.value}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='two'){bpD.two=t.checked;render()}
  if(t.id==='v-remind'){visD.remind=t.checked}
  if(t.id==='v-tbd'){visD.tbd=t.checked}
  if(t.id==='s-big'){S.settings.big=t.checked;save();applySettings()}
  if(t.id==='s-city'){geocode(t.value)}
  if(t.id==='imp-file'&&t.files[0]){try{const files=importData(JSON.parse(await t.files[0].text()));await FILES.clear();await restoreFiles(files);closeSheet();bpD=newBp();hrD=newHr();applySettings();render();toast('Dati caricati 👍');fetchWeather()}
    catch(err){toast('Questo file non è una copia di SaluteRobi.')}}
  if(t.id==='ocr'&&t.files[0]){let img=null;try{img=await readImg(t.files[0],400)}catch(err){}
    ocr={state:'reading',img};render();
    setTimeout(()=>{const r=Math.random;bpD.sys=Math.round(124+r()*16);bpD.dia=Math.round(76+r()*10);bpD.pulse=Math.round(64+r()*12);ocr.state='done';if(route==='misure')render()},1400)}
  if((t.id==='att-cam'||t.id==='att-file')&&t.files.length){const list=[...t.files];t.value='';await addAttachments(list)}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const v=$('#viewer');if(v&&!v.hidden){closeViewer();return}if(!$('#sheetWrap').hidden)closeSheet()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROUTES.includes(h)&&h!==route){route=h;lastRes=null;render();window.scrollTo(0,0)}});

function applySettings(){document.documentElement.style.setProperty('--fs',S.settings.big?'21px':'18px');$('#bigBtn').setAttribute('aria-pressed',!!S.settings.big)}
const TABS=[['oggi','Oggi','home'],['farmaci','Medicine','pill'],['misure','Misure','pulse'],['storico','Storico','chart'],['visite','Visite','cal']];
function render(){
  $('#view').innerHTML=({oggi:viewOggi,farmaci:viewFarmaci,misure:viewMisure,storico:viewStorico,visite:viewVisite,report:viewReport})[route]();
  const cur=route==='report'?'storico':route;
  $('#tabs').innerHTML=TABS.map(([r,l,i])=>`<button class="tab" data-a="go" data-r="${r}" ${cur===r?'aria-current="page"':''}><span class="ti">${ico[i]}</span>${l}</button>`).join('');
  $('#demoChip').hidden=!S.demo;
}
$('#brandMark').innerHTML=ico.heart;$('#setBtn').innerHTML=ico.gear;
applySettings();render();fetchWeather();setInterval(fetchWeather,18e5);

/* Show the reminder once on open, the way the phone would when a dose is due. */
setTimeout(()=>{const g=groupsFor(today()).find(x=>{const st=groupState(x,true);return st==='late'||st==='now'});if(g&&$('#sheetWrap').hidden)showNotif(g)},2200);
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
